name: Daily Danish title discovery

on:
  schedule:
    # 03:17 UTC every day — off-peak, avoids the exact-hour rush other
    # scheduled jobs pile onto.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  trigger-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/discover on the live addon
        run: |
          curl -sS -X POST \
            --max-time 280 \
            -w "\nHTTP status: %{http_code}\n" \
            https://danish-nuvio-catalog.onrender.com/internal/discover
